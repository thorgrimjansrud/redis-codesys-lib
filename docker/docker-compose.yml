
# "<PATH>/redis.conf" must be updated to fit actual path in the device
# Use Network_mode to communicate from Insight localhost (127.0.0.1) to Redis db.

version: "3"

services:
  redis-server:
    image: redis/redis-stack-server:latest
    container_name: redis-stack
    restart: always
    network_mode: host
    command: redis-stack-server --include /usr/local/etc/redis/redis.conf
    volumes:
      - /tmp:/tmp
      - redis:/data
      - /home/pi/redis/redis.conf:/usr/local/etc/redis/redis.conf

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    restart: always
    network_mode: host
    ports:
      - '5540:5540'
    volumes:
      - redisinsight:/data

  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: always
    ports:
      - '3000:3000'
    volumes:
      - /tmp:/tmp

volumes:
  redis:
  redisinsight:
